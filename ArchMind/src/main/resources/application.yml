# JWT 配置
jwt:
  secret: 你的JWT密钥，至少32位字符，例如：mySecretKey123456789012345678901234567890
  access-token-expire: 7200   # 访问令牌过期时间（秒），默认2小时
  refresh-token-expire: 604800  # 刷新令牌过期时间（秒），默认7天
  issuer: demo-app


spring:
   data:
    redis:
      port: 6379
      host: 127.0.0.1
      database: 0
      timeout: 3000ms
