# JWT 配置
jwt:
  secret: 你的JWT密钥，至少32位字符，例如：mySecretKey123456789012345678901234567890
  access-token-expire: 7200   # 访问令牌过期时间（秒），默认2小时
  refresh-token-expire: 604800  # 刷新令牌过期时间（秒），默认7天
  issuer: demo-app


spring:
  ai:
    model:
      chat: deepseek
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-chat
        base-url: https://api.deepseek.com
  # 数据源配置（本地开发先用 SQLite，接入 MySQL/PostgreSQL 时替换）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.21.160.203:3306/archmind?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: archmind
    password: your_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  # redis配置
  data:
    redis:
      port: 6379
      host: 172.21.160.203
      database: 0
      timeout: 3000ms

  neo4j:
    uri: bolt://172.21.160.203:7687
    authentication:
      username: neo4j
      password: 12345678

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

upload:
  # 代码上传后统一落地的根目录（本地开发用相对路径，生产环境可改为 /data/code-workspace）
  base-dir: ./code-workspace
  # 压缩包大小限制，单位 MB
  max-zip-size-mb: 500
  # git 超时时间，单位秒
  git-time-out-seconds: 60
